name: Build extension release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Check third-party notices
        run: |
          node scripts/notices.mjs
          git diff --exit-code -- THIRD_PARTY_NOTICES.txt
      - run: npm run package
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Prepare release files and validate tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            export RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          npm run release:prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: langloop-release
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: langloop-release
          path: release
      - name: Verify asset checksum
        working-directory: release
        run: sha256sum -c SHA256SUMS.txt
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag --draft --title "LangLoop $RELEASE_TAG" \
            --notes-file release/RELEASE-NOTES.md \
            release/langloop-extension.zip release/SHA256SUMS.txt release/INSTALL.txt
